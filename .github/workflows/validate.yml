name: Validate

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m compileall -q remote.py __init__.py
      - name: Validate manifest.json
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("manifest.json").read_text())
          for key in ("domain", "name", "version", "codeowners"):
              assert key in data, f"missing {key}"
          PY
